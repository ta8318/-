<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아파트 바이러스 퇴치단</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a30;color:#eef5ff;font-family:system-ui,sans-serif;padding:24px;min-height:100vh}main{max-width:900px;margin:auto}header{color:#81edc6;font-size:13px;letter-spacing:3px}h1{font-size:clamp(28px,6vw,44px);margin:12px 0}p{color:#adbed6;line-height:1.6}.stats{display:flex;gap:10px;margin:22px 0}.stat{flex:1;background:#20314c;border-radius:12px;padding:14px}.stat span{display:block;font-size:12px;color:#b5c6dd}.stat strong{font-size:24px}.scene{position:relative;background:linear-gradient(#233d62,#59747f);padding:24px 20px 0;border-radius:20px;overflow:hidden}.moon{position:absolute;right:25px;top:15px;font-size:35px}.roof{position:relative;text-align:center;background:#344865;padding:12px;border-radius:10px 10px 0 0;font-weight:bold;letter-spacing:3px;margin:20px 10% 0}.building{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:18px;background:#697b92;border:7px solid #8191a6;border-bottom:0}.room{position:relative;min-height:115px;background:#e8dcb5;border:5px solid #3c5069;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#46526a;overflow:hidden}.number{position:absolute;top:4px;left:6px;font-size:11px}.safe{font-size:24px;opacity:.4}.infected{background:#384158;border-color:#b1ec91}.virus{font-size:35px;line-height:1.1;animation:wobble 1s infinite alternate}.word{font-weight:800;color:#fff;font-size:clamp(15px,3vw,21px);margin:4px 0}.meter{height:4px;background:#243348;position:absolute;bottom:0;left:0;width:100%}.meter i{display:block;height:100%;background:#f9b17b}.ground{text-align:center;background:#1f403e;padding:12px;color:#b8d9bf;font-size:13px}.controls{margin-top:18px;background:#1d2d47;padding:20px;border-radius:16px}label{display:block;color:#c3d5eb;font-size:14px;margin-bottom:10px}.row{display:flex;gap:10px}input{min-width:0;flex:1;background:#0f1c30;border:2px solid #526b8e;border-radius:10px;color:white;padding:14px;font-size:19px}input:focus{outline:2px solid #81edc6}button{background:#81edc6;color:#15372f;border:0;border-radius:10px;padding:12px 18px;font-weight:bold;font-size:16px;cursor:pointer}#message{min-height:26px;margin:12px 0 0}footer{text-align:center;font-size:12px;color:#97abc5;padding:20px}@keyframes wobble{to{transform:rotate(12deg) scale(1.08)}}@media(max-width:500px){body{padding:14px}.scene{padding:12px 8px 0}.building{gap:6px;padding:8px}.room{min-height:105px}.row{flex-wrap:wrap}.row button{flex:1}.stat{padding:10px}}@media(prefers-reduced-motion:reduce){.virus{animation:none}}
</style>
<main><header>APARTMENT DEFENSE · 101동</header><h1>아파트 바이러스 퇴치단 🦠</h1><p>우리 아파트를 지켜 주세요! 감염된 집의 단어를 입력하고 Enter를 누르면 바이러스가 사라집니다.</p>
<div class="stats"><div class="stat"><span>남은 시간</span><strong id="time">60초</strong></div><div class="stat"><span>퇴치한 바이러스</span><strong id="score">0</strong></div><div class="stat"><span>아파트 체력</span><strong id="health">♥ 5</strong></div></div>
<section class="scene" aria-label="101동 아파트"><div class="moon" aria-hidden="true">🌙</div><div class="roof">101동 · 한마음 아파트</div><div class="building" id="building"></div><div class="ground">🌳 함께 지키는 깨끗한 우리 동네 🌳</div></section>
<section class="controls"><label for="answer">감염된 집에 보이는 단어를 입력하세요. 제한 시간 안에 퇴치하지 못하면 체력이 줄어요!</label><div class="row"><input id="answer" placeholder="단어 입력 후 Enter" autocomplete="off" spellcheck="false" disabled><button id="start">방역 시작</button></div><p id="message" role="status" aria-live="polite">60초 동안 체력을 지키면 승리! 시간이 지날수록 바이러스가 빨라집니다.</p></section><footer>한글 타자 디펜스 · 9세대 아파트 · 설치 없이 플레이</footer></main>
<script>
const words=['비누','청소','환기','건강','손씻기','마스크','소독','햇살','깨끗이','안전','이웃','행복','방역','산책','공기','면역','물방울','초록빛','우리집','아파트','세탁','수건','창문','청결'];
const el=id=>document.getElementById(id);let active=false,score=0,health=5,started=0,nextSpawn=0,timer;let infections=Array(9).fill(null);
const roomNumbers=['301','302','303','201','202','203','101','102','103'];
function render(){el('building').innerHTML=infections.map((v,i)=>`<div class="room ${v?'infected':''}" aria-label="${roomNumbers[i]}호 ${v?'바이러스 '+v.word:'안전'}"><span class="number">${roomNumbers[i]}호</span>${v?`<span class="virus" aria-hidden="true">🦠</span><span class="word">${v.word}</span><span class="meter"><i style="width:${Math.max(0,(v.expires-Date.now())/v.lifetime*100)}%"></i></span>`:'<span class="safe" aria-hidden="true">🪴</span>'}</div>`).join('');el('score').textContent=score;el('health').textContent='♥ '+health;}
function spawn(now){const free=infections.map((v,i)=>v?null:i).filter(i=>i!==null);if(!free.length)return;const available=words.filter(w=>!infections.some(v=>v&&v.word===w));const lifetime=Math.max(6500,12000-(now-started)/12);infections[free[Math.floor(Math.random()*free.length)]]={word:available[Math.floor(Math.random()*available.length)],expires:now+lifetime,lifetime};}
function finish(won){active=false;clearInterval(timer);el('answer').disabled=true;el('start').textContent='다시 도전';el('message').textContent=won?`방역 성공! 아파트를 지켰어요. 바이러스 ${score}마리 퇴치!`:`방역 실패! 체력이 모두 소진됐어요. ${score}마리 퇴치! 다시 도전해 보세요.`;}
function tick(){if(!active)return;const now=Date.now();const end=started+60000;const cutoff=Math.min(now,end);for(let i=0;i<infections.length;i++){if(infections[i]&&infections[i].expires<=cutoff){infections[i]=null;health--;el('message').textContent='바이러스가 퍼졌어요! 체력 -1';}}health=Math.max(0,health);el('time').textContent=Math.max(0,Math.ceil((end-now)/1000))+'초';if(!health){render();finish(false);return;}if(now>=end){render();finish(true);return;}if(now>=nextSpawn){spawn(now);nextSpawn=now+Math.max(1500,3400-(now-started)/30);}render();}
el('start').onclick=()=>{clearInterval(timer);score=0;health=5;active=true;started=Date.now();infections=Array(9).fill(null);spawn(started);nextSpawn=started+3000;el('answer').value='';el('answer').disabled=false;el('answer').focus();el('time').textContent='60초';el('message').textContent='바이러스 발견! 표시된 단어를 입력해서 퇴치하세요.';el('start').textContent='처음부터';render();timer=setInterval(tick,100);};
el('answer').addEventListener('keydown',event=>{if(event.key!=='Enter'||event.isComposing||event.keyCode===229||!active)return;tick();if(!active)return;const answer=el('answer').value.trim();if(!answer)return;const index=infections.findIndex(v=>v&&v.word===answer);if(index>=0){infections[index]=null;score++;el('answer').value='';el('message').textContent=`${roomNumbers[index]}호 방역 완료! 잘하고 있어요.`;render();}else{el('message').textContent='감염된 집의 단어를 확인해 주세요.';el('answer').select();}});
render();
</script>
</html>
