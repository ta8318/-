<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아파트 바이러스 퇴치단</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a30;color:#eef5ff;font-family:system-ui,sans-serif;padding:24px;min-height:100vh}main{max-width:900px;margin:auto}header{color:#81edc6;font-size:13px;letter-spacing:3px}h1{font-size:clamp(28px,6vw,44px);margin:12px 0}p{color:#adbed6;line-height:1.6}.stats{display:flex;gap:10px;margin:22px 0}.stat{flex:1;background:#20314c;border-radius:12px;padding:14px}.stat span{display:block;font-size:12px;color:#b5c6dd}.stat strong{font-size:24px}.scene{position:relative;background:linear-gradient(#233d62,#59747f);padding:24px 20px 0;border-radius:20px;overflow:hidden}.moon{position:absolute;right:25px;top:15px;font-size:35px}.roof{position:relative;text-align:center;background:#344865;padding:12px;border-radius:10px 10px 0 0;font-weight:bold;letter-spacing:3px;margin:20px 10% 0}.building{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:18px;background:#697b92;border:7px solid #8191a6;border-bottom:0}.room{position:relative;min-height:115px;background:#e8dcb5;border:5px solid #3c5069;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#46526a;overflow:hidden}.number{position:absolute;top:4px;left:6px;font-size:11px}.safe{font-size:24px;opacity:.4}.infected{background:#384158;border-color:#b1ec91}.virus{font-size:35px;line-height:1.1;animation:wobble 1s infinite alternate}.word{font-weight:800;color:#fff;font-size:clamp(15px,3vw,21px);margin:4px 0}.meter{height:4px;background:#243348;position:absolute;bottom:0;left:0;width:100%}.meter i{display:block;height:100%;background:#f9b17b}.ground{text-align:center;background:#1f403e;padding:12px;color:#b8d9bf;font-size:13px}.controls{margin-top:18px;background:#1d2d47;padding:20px;border-radius:16px}label{display:block;color:#c3d5eb;font-size:14px;margin-bottom:10px}.row{display:flex;gap:10px}input{min-width:0;flex:1;background:#0f1c30;border:2px solid #526b8e;border-radius:10px;color:white;padding:14px;font-size:19px}input:focus{outline:2px solid #81edc6}button{background:#81edc6;color:#15372f;border:0;border-radius:10px;padding:12px 18px;font-weight:bold;font-size:16px;cursor:pointer}#message{min-height:26px;margin:12px 0 0}footer{text-align:center;font-size:12px;color:#97abc5;padding:20px}@keyframes wobble{to{transform:rotate(12deg) scale(1.08)}}@media(max-width:500px){body{padding:14px}.scene{padding:12px 8px 0}.building{gap:6px;padding:8px}.room{min-height:105px}.row{flex-wrap:wrap}.row button{flex:1}.stat{padding:10px}}@media(prefers-reduced-motion:reduce){.virus{animation:none}}
/* Side cutaway: open rooms, floor slabs, and an exposed stairwell. */
.roof{margin:20px 0 0;border-radius:0;background:#46536a;border-top:8px solid #a0afbd;letter-spacing:1px}.building{gap:0;padding:0 62px 0 0;border:0;border-left:10px solid #a0afbd;border-right:10px solid #a0afbd;background:#a0afbd;overflow:hidden}.building::after{content:'계단실';position:absolute;right:0;top:0;bottom:0;width:60px;text-align:center;padding-top:8px;font-size:11px;color:#d9e3ec;border-left:7px solid #a0afbd;background:repeating-linear-gradient(145deg,transparent 0 38px,#b9c7cf 39px 44px,transparent 45px 78px),#33465a}.room{min-height:145px;border:0;border-right:5px solid #a0afbd;border-bottom:12px solid #a0afbd;border-radius:0;background:linear-gradient(#dfd5c1 0 78%,#9b806b 78%);isolation:isolate}.room::before{content:'';position:absolute;left:12%;top:22px;width:25%;height:35px;background:linear-gradient(90deg,transparent 46%,#f0ede0 46% 54%,transparent 54%),linear-gradient(transparent 45%,#f0ede0 45% 55%,transparent 55%),#8ab4c6;border:3px solid #f0ede0;z-index:-1}.furniture{position:absolute;right:9%;bottom:12px;font-size:30px;opacity:.75;z-index:-1}.infected{background:linear-gradient(#354554 0 78%,#655e62 78%);box-shadow:inset 0 0 28px #9eee6955}.number{background:#263d50;color:#fff;padding:2px 5px;border-radius:3px;top:3px;left:3px}.safe{font-size:20px;opacity:.7;margin-top:20px}.virus{filter:drop-shadow(0 3px 5px #13261e);margin-top:16px}.word{background:#152b40e8;padding:2px 10px;border-radius:6px}.ground{border-top:8px solid #9eafaa}.view-label{color:#d6e7f7;font-size:12px;margin:0 0 6px}@media(max-width:500px){.building{padding:0 35px 0 0;gap:0;border-width:6px}.building::after{width:35px;border-left-width:4px;font-size:9px}.room{min-height:128px;border-right-width:3px;border-bottom-width:9px}.furniture{font-size:23px}.room::before{width:30%;left:8%;height:28px}.word{padding:2px 5px}.number{font-size:9px}}
/* Friendly little virus characters, drawn without external assets. */
.virus{position:relative;display:block;width:43px;height:39px;margin:18px 0 7px;background:var(--body,#9be6bd);border:3px solid var(--edge,#53b78b);border-radius:47% 50% 44% 48%;box-shadow:inset 3px 3px 0 #ffffff66,0 3px 5px #14253955;filter:none;animation:wobble 1.3s ease-in-out infinite alternate}.virus::before{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:var(--body,#9be6bd);top:-9px;left:15px;box-shadow:-20px 13px 0 1px var(--body,#9be6bd),23px 13px 0 1px var(--body,#9be6bd),-12px 36px 0 var(--body,#9be6bd),15px 36px 0 var(--body,#9be6bd)}.virus::after{content:'';position:absolute;width:5px;height:7px;border-radius:50%;background:#243d4c;left:9px;top:9px;box-shadow:13px 0 #243d4c}.virus .smile{position:absolute;left:13px;top:19px;width:11px;height:7px;border:2px solid #284859;border-top:0;border-radius:0 0 12px 12px}.virus .cheeks{position:absolute;left:3px;top:18px;width:7px;height:4px;background:#f794b5;border-radius:50%;box-shadow:23px 0 #f794b5}.virus.pink{--body:#ffc1d8;--edge:#da8eaf}.virus.lavender{--body:#d1c1ff;--edge:#a190d5}.virus.peach{--body:#ffd5a1;--edge:#d9aa73}@media(prefers-reduced-motion:reduce){.virus{animation:none}}
</style>
<main><header>APARTMENT DEFENSE · 101동</header><h1>아파트 바이러스 퇴치단 🦠</h1><p>우리 아파트를 지켜 주세요! 감염된 집의 단어를 입력하고 Enter를 누르면 바이러스가 사라집니다.</p>
<div class="stats"><div class="stat"><span>현재 단계</span><strong id="stage">1 / 5</strong></div><div class="stat"><span>퇴치한 바이러스</span><strong id="score">0</strong></div><div class="stat"><span>남은 목숨</span><strong id="health">♥ 5</strong></div></div>
<section class="scene" aria-label="아파트 옆모습 단면도"><div class="moon" aria-hidden="true">🌙</div><p class="view-label">옆에서 본 아파트 · 방 안을 들여다보는 단면도</p><div class="roof">101동 · 한마음 아파트 단면</div><div class="building" id="building"></div><div class="ground">🌳 함께 지키는 깨끗한 우리 동네 🌳</div></section>
<section class="controls"><label for="answer">감염된 집에 보이는 단어를 입력하세요. 제한 시간 안에 퇴치하지 못하면 목숨이 하나 줄어요!</label><div class="row"><input id="answer" placeholder="단어 입력 후 Enter" autocomplete="off" spellcheck="false" disabled><button id="start">방역 시작</button></div><p id="message" role="status" aria-live="polite">목숨 5개로 시작! 단계별 목표를 달성하고 마지막 5단계를 완료하세요.</p><p id="progress">1단계 목표: 0 / 5마리</p></section><footer>한글 타자 디펜스 · 9세대 아파트 · 설치 없이 플레이</footer></main>
<script>
const beginnerWords=['나비','오리','나무','바다','비누','사자','모자','포도','두부','우유','아기','버스','기차','고래','노루','여우','하마','치마','휴지','소리'];
const words=['비누','청소','환기','건강','손씻기','마스크','소독','햇살','깨끗이','안전','이웃','행복','방역','산책','공기','면역','물방울','초록빛','우리집','아파트','세탁','수건','창문','청결'];
const el=id=>document.getElementById(id);let active=false,score=0,health=5,stage=1,stageScore=0,nextSpawn=0,timer;let infections=Array(9).fill(null);
const roomNumbers=['301','302','303','201','202','203','101','102','103'];
function render(){el('building').innerHTML=infections.map((v,i)=>`<div class="room ${v?'infected':''}" aria-label="${roomNumbers[i]}호 ${v?'바이러스 '+v.word:'안전'}"><span class="number">${roomNumbers[i]}호</span><span class="furniture" aria-hidden="true">${['🛋️','🛏️','🪑'][i%3]}</span>${v?`<span class="virus ${['mint','pink','lavender','peach'][i%4]}" aria-hidden="true"><span class="smile"></span><span class="cheeks"></span></span><span class="word">${v.word}</span><span class="meter"><i style="width:${Math.max(0,(v.expires-Date.now())/v.lifetime*100)}%"></i></span>`:'<span class="safe" aria-hidden="true">🪴</span>'}</div>`).join('');el('score').textContent=score;el('health').textContent='♥ '+health;el('stage').textContent=stage+' / '+targets.length;el('progress').textContent=stage+'단계 목표: '+stageScore+' / '+targets[stage-1]+'마리'+(stage===1?' · 받침 없는 두 글자':'');}
function spawn(now){const free=infections.map((v,i)=>v?null:i).filter(i=>i!==null);if(!free.length)return;const pool=stage===1?beginnerWords:words;const available=pool.filter(w=>!infections.some(v=>v&&v.word===w));const lifetime=13000-stage*1300;infections[free[Math.floor(Math.random()*free.length)]]={word:available[Math.floor(Math.random()*available.length)],expires:now+lifetime,lifetime};}
const targets=[5,7,9,11,13];
function finish(won){active=false;clearInterval(timer);el('answer').disabled=true;el('start').textContent='다시 도전';el('message').textContent=won?`최종 방역 성공! 5단계를 모두 완료했어요. 총 ${score}마리 퇴치 · 남은 목숨 ${health}개!`:`목숨을 모두 잃었어요. ${stage}단계에서 ${score}마리 퇴치! 다시 도전해 보세요.`;}
function advance(){if(stageScore<targets[stage-1])return;if(stage===targets.length){render();finish(true);return;}stage++;stageScore=0;infections=Array(9).fill(null);const now=Date.now();spawn(now);nextSpawn=now+3400-stage*380;el('message').textContent=`${stage}단계 시작! 목표 ${targets[stage-1]}마리 · 남은 목숨 ${health}개`;}
function tick(){if(!active)return;const now=Date.now();for(let i=0;i<infections.length;i++){if(infections[i]&&infections[i].expires<=now){infections[i]=null;health--;el('message').textContent='바이러스가 퍼졌어요! 목숨 -1';}}health=Math.max(0,health);if(!health){render();finish(false);return;}if(now>=nextSpawn){spawn(now);nextSpawn=now+3400-stage*380;}render();}
el('start').onclick=()=>{clearInterval(timer);score=0;health=5;stage=1;stageScore=0;active=true;const now=Date.now();infections=Array(9).fill(null);spawn(now);nextSpawn=now+3020;el('answer').value='';el('answer').disabled=false;el('answer').focus();el('message').textContent='1단계: 받침 없는 두 글자! 단어를 입력해 바이러스 5마리를 퇴치하세요.';el('start').textContent='처음부터';render();timer=setInterval(tick,100);};
el('answer').addEventListener('keydown',event=>{if(event.key!=='Enter'||event.isComposing||event.keyCode===229||!active)return;tick();if(!active)return;const answer=el('answer').value.trim();if(!answer)return;const index=infections.findIndex(v=>v&&v.word===answer);if(index>=0){infections[index]=null;score++;stageScore++;el('answer').value='';el('message').textContent=`${roomNumbers[index]}호 방역 완료! 잘하고 있어요.`;advance();render();}else{el('message').textContent='감염된 집의 단어를 확인해 주세요.';el('answer').select();}});
render();
</script>
</html>
